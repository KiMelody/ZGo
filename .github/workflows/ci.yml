name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: UI color guard
        run: python tool/ui_color_guard.py

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
